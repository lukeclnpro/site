<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio de projets publics affichés depuis GitHub et maintenus facilement via une liste JavaScript."
    />
    <title>Portfolio | Projets</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container nav">
        <a class="brand" href="#top">Luke COULON</a>
        <nav aria-label="Navigation principale">
          <a href="#projects" data-i18n="navProjects">Projets</a>
          <a href="https://github.com/LukeClnpro" target="_blank" rel="noreferrer" data-i18n="navGithub">GitHub</a>
        </nav>
        <div class="lang-switch" aria-label="Language switcher">
          <button type="button" class="lang-button" data-lang-switch="fr" aria-label="Français">FR</button>
          <button type="button" class="lang-button" data-lang-switch="en" aria-label="English">EN</button>
        </div>
      </div>
    </header>

    <main id="top">
      <section class="hero">
        <div class="container hero-grid">
          <div class="hero-copy">
            <p class="eyebrow" data-i18n="heroEyebrow">Portfolio • GitHub • projets</p>
            <h1 data-i18n="heroTitle">Mes Projets</h1>
            <p class="lead" data-i18n="heroLead">
              Une sélection de projets publiés sur GitHub, avec un accès direct au code source et aux détails du projet.
            </p>
            <div class="cta-group">
              <a
                class="button secondary"
                href="https://github.com/LukeClnpro"
                target="_blank"
                rel="noreferrer"
                data-i18n="heroSecondary"
              >
                Voir mon GitHub Professionnel
              </a>
              
            </div>
          </div>

        </div>
      </section>

      <section id="projects" class="projects">
        <div class="container">
          <div class="section-head">
            <p class="eyebrow" data-i18n="sectionProjects">Projects</p>
          </div>
          <div id="project-list" class="project-grid" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p><a href="https://github.com/LukeCOULON" target="_blank" rel="noreferrer" data-i18n="footerGithub">Voir mon GitHub personnel</a></p>
      </div>
    </footer>

    <script src="js/projects.js"></script>
    <script src="js/github.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
